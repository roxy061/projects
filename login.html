<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Project Archive Authentication</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-slate-950">

    <!-- Ambient Glow Backgrounds -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 border border-slate-800">
        
        <!-- Header & Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-slate-950 mb-4 shadow-lg shadow-emerald-500/20 hover:scale-105 transition-transform">
                <i data-lucide="shield-check" class="w-7 h-7"></i>
            </a>
            <h1 class="text-2xl font-bold text-white" id="form-title">เข้าสู่ระบบ</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono" id="form-subtitle">Authentication Portal</p>
        </div>

        <!-- Toggle Switch -->
        <div class="flex p-1 bg-slate-900 rounded-xl mb-6 border border-slate-800" id="form-tabs">
            <button onclick="toggleForm('signin')" id="btn-signin" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 transition-colors">เข้าสู่ระบบ</button>
            <button onclick="toggleForm('signup')" id="btn-signup" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-colors">สมัครสมาชิก</button>
        </div>

        <!-- Notification Alert -->
        <div id="alert-box" class="hidden mb-6 p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

        <!-- ================= SIGN IN FORM ================= -->
        <form id="signin-form" onsubmit="handleSignIn(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อผู้ใช้งาน (Username):</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="text" id="si-username" required placeholder="admin หรือ std66001" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รหัสผ่าน (Password):</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="si-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
                <div class="mt-2 text-right">
                    <button type="button" onclick="toggleForm('forgot')" class="text-xs text-emerald-400 hover:text-emerald-300 transition-colors">ลืมรหัสผ่าน? (Forgot Password?)</button>
                </div>
            </div>

            <button type="submit" id="btn-submit-signin" class="w-full py-3 mt-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>ยืนยันเข้าสู่ระบบ</span>
            </button>
        </form>

        <!-- ================= SIGN UP FORM ================= -->
        <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-4 hidden max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อ-นามสกุล (Full Name):</label>
                <div class="relative">
                    <i data-lucide="contact" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="text" id="su-fullname" required placeholder="ชื่อ นามสกุล" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">อีเมล (Email):</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="email" id="su-email" required placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อผู้ใช้งาน (Username):</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="text" id="su-username" required placeholder="ตั้งชื่อผู้ใช้งาน (ภาษาอังกฤษ/ตัวเลข)" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รหัสผ่าน (Password):</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="su-password" required minlength="6" placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ยืนยันรหัสผ่าน (Confirm Password):</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="su-confirm-password" required minlength="6" placeholder="กรอกรหัสผ่านอีกครั้ง" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ระดับชั้น (Grade Level):</label>
                <select id="su-level" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
                    <option value="" disabled selected>เลือกระดับชั้นของคุณ</option>
                    <option value="ปวช. 1">ปวช. 1</option>
                    <option value="ปวช. 2">ปวช. 2</option>
                    <option value="ปวช. 3">ปวช. 3</option>
                    <option value="ปวส. 1">ปวส. 1</option>
                    <option value="ปวส. 2">ปวส. 2</option>
                </select>
            </div>

            <button type="submit" id="btn-submit-signup" class="w-full py-3 mt-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-sm transition-all shadow-lg flex items-center justify-center gap-2 border border-slate-700">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>สร้างบัญชีผู้ใช้</span>
            </button>
        </form>

        <!-- ================= FORGOT PASSWORD FORM ================= -->
        <form id="forgot-form" class="space-y-4 hidden">
            
            <!-- Step 1: Request OTP -->
            <div id="forgot-step-1" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">อีเมลที่ใช้สมัครสมาชิก (Registered Email):</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="email" id="fg-email" placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                    </div>
                </div>

                <button type="button" onclick="requestOTP()" id="btn-request-otp" class="w-full py-3 mt-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>ขอรับรหัส OTP</span>
                </button>
                
                <div class="text-center mt-4">
                    <button type="button" onclick="toggleForm('signin')" class="text-xs text-slate-400 hover:text-white transition-colors">ยกเลิก กลับไปหน้าเข้าสู่ระบบ</button>
                </div>
            </div>

            <!-- Step 2: Reset Password -->
            <div id="forgot-step-2" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รหัส OTP 6 หลัก:</label>
                    <div class="relative">
                        <i data-lucide="shield-alert" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="text" id="fg-otp" maxlength="6" placeholder="000000" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono tracking-widest transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รหัสผ่านใหม่ (New Password):</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="fg-new-password" minlength="6" placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ยืนยันรหัสผ่านใหม่ (Confirm Password):</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="fg-confirm-password" minlength="6" placeholder="กรอกรหัสผ่านอีกครั้ง" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono transition-colors">
                    </div>
                </div>

                <button type="button" onclick="resetPassword()" id="btn-reset-password" class="w-full py-3 mt-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>ยืนยันการเปลี่ยนรหัสผ่าน</span>
                </button>
                
                <div class="text-center mt-4">
                    <button type="button" onclick="toggleForm('signin')" class="text-xs text-slate-400 hover:text-white transition-colors">ยกเลิก กลับไปหน้าเข้าสู่ระบบ</button>
                </div>
            </div>
        </form>

        <div class="mt-8 text-center" id="guest-access-container">
            <button onclick="guestAccess()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm transition-all flex items-center justify-center gap-2 border border-slate-700">
                <i data-lucide="users" class="w-4 h-4"></i> เข้าชมในฐานะบุคคลทั่วไป (ไม่สมัครสมาชิก)
            </button>
        </div>
    </div>

    <style>
        /* Custom Scrollbar for Sign Up Form */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

        const API_URL = 'api.php';

        function guestAccess() {
            localStorage.setItem('nvc_guest', 'true');
            window.location.href = 'index.html';
        }

        function toggleForm(type) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const forgotForm = document.getElementById('forgot-form');
            
            const btnSignin = document.getElementById('btn-signin');
            const btnSignup = document.getElementById('btn-signup');
            const formTabs = document.getElementById('form-tabs');
            const guestContainer = document.getElementById('guest-access-container');
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            
            // Hide alert
            document.getElementById('alert-box').classList.add('hidden');

            // Reset forgot password steps
            document.getElementById('forgot-step-1').classList.remove('hidden');
            document.getElementById('forgot-step-2').classList.add('hidden');
            document.getElementById('fg-email').value = '';
            document.getElementById('fg-otp').value = '';
            document.getElementById('fg-new-password').value = '';
            document.getElementById('fg-confirm-password').value = '';

            if(type === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                forgotForm.classList.add('hidden');
                formTabs.classList.remove('hidden');
                guestContainer.classList.remove('hidden');
                
                btnSignin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 transition-colors';
                btnSignup.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-colors';
                title.innerText = 'เข้าสู่ระบบ';
                subtitle.innerText = 'Authentication Portal';
            } else if (type === 'signup') {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                forgotForm.classList.add('hidden');
                formTabs.classList.remove('hidden');
                guestContainer.classList.remove('hidden');
                
                btnSignup.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 transition-colors';
                btnSignin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-colors';
                title.innerText = 'สมัครสมาชิก';
                subtitle.innerText = 'Create your account';
            } else if (type === 'forgot') {
                signinForm.classList.add('hidden');
                signupForm.classList.add('hidden');
                forgotForm.classList.remove('hidden');
                formTabs.classList.add('hidden');
                guestContainer.classList.add('hidden');
                
                title.innerText = 'ลืมรหัสผ่าน';
                subtitle.innerText = 'Reset your password via Email';
            }
        }

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alert-box');
            if(isSuccess) {
                box.className = 'mb-6 p-3.5 rounded-xl text-xs bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 flex items-center gap-2';
                box.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>${msg}</span>`;
            } else {
                box.className = 'mb-6 p-3.5 rounded-xl text-xs bg-red-500/20 border border-red-500/30 text-red-300 flex items-center gap-2';
                box.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4"></i> <span>${msg}</span>`;
            }
            box.classList.remove('hidden');
            lucide.createIcons();
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const user = document.getElementById('si-username').value.trim();
            const pass = document.getElementById('si-password').value.trim();
            const btn = document.getElementById('btn-submit-signin');
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังตรวจสอบ...`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_URL}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                if(data.status === 'success') {
                    showAlert('เข้าสู่ระบบสำเร็จ! กำลังเปลี่ยนหน้า...', true);
                    
                    // Save Session
                    localStorage.setItem('nvc_user_session', JSON.stringify(data.user));

                    setTimeout(() => {
                        if(data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || 'รหัสผ่านไม่ถูกต้อง');
                    btn.disabled = false;
                    btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> ยืนยันเข้าสู่ระบบ`;
                    lucide.createIcons();
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบสถานะ Backend/Nginx');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> ยืนยันเข้าสู่ระบบ`;
                lucide.createIcons();
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const fullname = document.getElementById('su-fullname').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const user = document.getElementById('su-username').value.trim();
            const pass = document.getElementById('su-password').value.trim();
            const confPass = document.getElementById('su-confirm-password').value.trim();
            const level = document.getElementById('su-level').value;
            const btn = document.getElementById('btn-submit-signup');

            if (pass !== confPass) {
                showAlert('รหัสผ่านไม่ตรงกัน');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึก...`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_URL}?action=register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, username: user, password: pass, level })
                });
                
                const data = await res.json();
                if(data.status === 'success') {
                    showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ', true);
                    setTimeout(() => {
                        document.getElementById('signup-form').reset();
                        toggleForm('signin');
                        btn.disabled = false;
                        btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> สร้างบัญชีผู้ใช้`;
                        lucide.createIcons();
                    }, 1500);
                } else {
                    showAlert(data.message || 'เกิดข้อผิดพลาด');
                    btn.disabled = false;
                    btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> สร้างบัญชีผู้ใช้`;
                    lucide.createIcons();
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบสถานะ Backend/Nginx');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> สร้างบัญชีผู้ใช้`;
                lucide.createIcons();
            }
        }

        // --- Forgot Password Logic ---
        async function requestOTP() {
            const email = document.getElementById('fg-email').value.trim();
            const btn = document.getElementById('btn-request-otp');

            if (!email) {
                showAlert('กรุณากรอกอีเมลของคุณ');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังส่ง...`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_URL}?action=forgot_password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    // Show Mock OTP (for development only)
                    showAlert(`ระบบจำลองทำงาน! รหัส OTP ของคุณคือ: <strong>${data.mock_otp}</strong>`, true);
                    
                    document.getElementById('forgot-step-1').classList.add('hidden');
                    document.getElementById('forgot-step-2').classList.remove('hidden');
                } else {
                    showAlert(data.message);
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบสถานะ Backend/Nginx');
            }

            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> <span>ขอรับรหัส OTP</span>`;
            lucide.createIcons();
        }

        async function resetPassword() {
            const email = document.getElementById('fg-email').value.trim();
            const otp = document.getElementById('fg-otp').value.trim();
            const newPass = document.getElementById('fg-new-password').value.trim();
            const confPass = document.getElementById('fg-confirm-password').value.trim();
            const btn = document.getElementById('btn-reset-password');

            if (!otp || !newPass || !confPass) {
                showAlert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            if (newPass !== confPass) {
                showAlert('รหัสผ่านไม่ตรงกัน');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังเปลี่ยนรหัสผ่าน...`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_URL}?action=reset_password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, new_password: newPass })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showAlert('เปลี่ยนรหัสผ่านสำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่', true);
                    setTimeout(() => {
                        toggleForm('signin');
                    }, 2000);
                } else {
                    showAlert(data.message);
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบสถานะ Backend/Nginx');
            }

            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>ยืนยันการเปลี่ยนรหัสผ่าน</span>`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
