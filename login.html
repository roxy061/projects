<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Student Project Archive Authentication</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-slate-950">

    <!-- Ambient Glow Backgrounds -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 border border-slate-800">
        
        <!-- Header & Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-slate-950 mb-4 shadow-lg shadow-emerald-500/20">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </a>
            <h1 class="text-2xl font-bold text-white">เข้าสู่ระบบหลังบ้าน</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono">Student & Admin Authentication</p>
        </div>

        <!-- Notification Alert -->
        <div id="login-alert" class="hidden mb-6 p-3.5 rounded-xl text-xs flex items-center gap-2"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อผู้ใช้งาน (Username / รหัสนักศึกษา):</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="text" id="username" required placeholder="admin หรือ std66001" value="admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รหัสผ่าน (Password):</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="password" required placeholder="••••••••" value="admin123" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">สิทธิ์การใช้งาน (Role):</label>
                <select id="role" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                    <option value="student">นักศึกษา (Student)</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 mt-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>ยืนยันเข้าสู่ระบบ</span>
            </button>
        </form>

        <!-- Demo Accounts Hint -->
        <div class="mt-6 pt-5 border-t border-slate-800 text-center">
            <div class="text-[11px] text-slate-500 font-mono mb-1">ทดสอบเข้าสู่ระบบ (Demo Account):</div>
            <div class="text-xs text-slate-400 font-mono bg-slate-900/80 p-2 rounded-xl border border-slate-800 inline-block">
                User: <span class="text-emerald-400 font-bold">admin</span> | Pass: <span class="text-emerald-400 font-bold">admin123</span>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> กลับสู่หน้าหลัก Public Showcase
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;
            const alertBox = document.getElementById('login-alert');

            if (user === 'admin' && pass === 'admin123') {
                alertBox.className = 'mb-6 p-3.5 rounded-xl text-xs bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 flex items-center gap-2';
                alertBox.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> เข้าสู่ระบบสำเร็จ! กำลังนำไปยังแดชบอร์ด...`;
                alertBox.classList.remove('hidden');
                lucide.createIcons();

                localStorage.setItem('nvc_user_session', JSON.stringify({
                    username: user,
                    role: role,
                    isLoggedIn: true,
                    time: new Date().toISOString()
                }));

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
            } else {
                alertBox.className = 'mb-6 p-3.5 rounded-xl text-xs bg-red-500/20 border border-red-500/30 text-red-300 flex items-center gap-2';
                alertBox.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4"></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ลอง admin / admin123)`;
                alertBox.classList.remove('hidden');
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
