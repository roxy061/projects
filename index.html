<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PROJECT.LOG | คลังเก็บผลงานโปรเจกต์</title>
    <meta name="description" content="Projects Archive & Showcase System">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind & Lucide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Check Session
        const session = JSON.parse(localStorage.getItem('nvc_user_session') || '{}');
        const isGuest = localStorage.getItem('nvc_guest') === 'true';
        
        if (!session.id && !isGuest) {
            window.location.href = 'login.html';
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-nav {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dynamic Theme Classes */
        .theme-text { color: var(--th-main); }
        .theme-bg { background-color: var(--th-main); }
        .theme-bg-soft { background-color: var(--th-soft); }
        .theme-border { border-color: var(--th-main); }
        .theme-border-soft { border-color: var(--th-soft); }
        .theme-gradient { background-image: linear-gradient(to right, var(--th-grad1), var(--th-grad2)); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="sticky top-0 z-40 glass-nav shadow-lg shadow-slate-950/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-xl theme-gradient flex items-center justify-center text-slate-950 font-bold shadow-lg group-hover:scale-105 transition-transform duration-300">
                    <i data-lucide="archive" class="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div class="flex items-center gap-2">
                    <span id="nav-brand" class="font-bold text-xl tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PROJECT.LOG</span>
                </div>
            </a>

            <!-- Auth Buttons -->
            <div class="flex items-center gap-3" id="nav-auth">
                <!-- Rendered via JS -->
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative pt-16 pb-16 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] theme-bg-soft rounded-full blur-[120px] pointer-events-none opacity-50"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="text-center max-w-3xl mx-auto">
                <h1 id="hero-title" class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight mb-4">
                    กำลังโหลด...
                </h1>
                <p id="hero-desc" class="text-slate-400 text-sm sm:text-base mb-10 max-w-2xl mx-auto">
                    <!-- Loaded via API -->
                </p>
                
                <div class="relative flex items-center group max-w-2xl mx-auto">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-4 pointer-events-none group-focus-within:theme-text transition-colors"></i>
                    <input type="text" id="search-input" placeholder="ค้นหาชื่อโปรเจกต์, เทคโนโลยี, แท็ก..." 
                        class="w-full pl-12 pr-12 py-4 rounded-2xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none theme-border text-sm sm:text-base transition-all shadow-lg">
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20 flex-1 w-full">
        
        <!-- Filter Bar -->
        <div class="glass-card p-5 sm:p-6 rounded-2xl mb-10 flex flex-col lg:flex-row lg:items-start justify-between gap-6">
            <div class="flex-1">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-3 font-mono flex items-center gap-1.5">
                    <i data-lucide="graduation-cap" class="w-4 h-4 theme-text"></i> ระดับชั้น:
                </span>
                <div class="flex flex-wrap gap-2" id="grade-filter-group">
                    <button data-grade="all" class="grade-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg text-slate-950 shadow-lg">ทั้งหมด</button>
                    <button data-grade="ปวช. 3" class="grade-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/50">ปวช. 3</button>
                    <button data-grade="ปวส. 1" class="grade-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/50">ปวส. 1</button>
                    <button data-grade="ปวส. 2" class="grade-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/50">ปวส. 2</button>
                </div>
            </div>

            <div class="flex-1 lg:pl-6 lg:border-l border-slate-800">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-3 font-mono flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-4 h-4 theme-text"></i> ประเภทเทคโนโลยี:
                </span>
                <div class="flex flex-wrap gap-2" id="category-filter-group">
                    <button data-cat="all" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg-soft theme-text theme-border-soft border">ทุกหมวดหมู่</button>
                    <button data-cat="IoT & Hardware" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50">IoT & Hardware</button>
                    <button data-cat="Software & Automation" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50">Software & Automation</button>
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 sm:gap-8">
            <!-- Rendered via JS -->
        </div>

        <!-- No Results -->
        <div id="no-results" class="hidden text-center py-20 glass-card rounded-2xl border border-slate-800">
            <i data-lucide="search-x" class="w-16 h-16 text-slate-600 mx-auto mb-4"></i>
            <h3 class="text-xl font-semibold text-slate-200">ไม่พบโปรเจกต์ที่ตรงกับเงื่อนไข</h3>
            <button onclick="resetFilters()" class="mt-6 px-6 py-2.5 bg-slate-800 hover:bg-slate-700 theme-text text-sm font-semibold rounded-xl transition-colors border border-slate-700">ล้างการค้นหา</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 font-mono">
            <div id="footer-text">Student Project Archive Showcase</div>
        </div>
    </footer>

    <!-- Project Details Modal -->
    <div id="project-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full max-w-4xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col border border-slate-700/50 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            
            <div class="p-5 sm:p-6 bg-slate-900 border-b border-slate-800 flex items-start justify-between">
                <div class="pr-4">
                    <div class="flex flex-wrap items-center gap-2 mb-3" id="modal-badges"></div>
                    <h2 class="text-xl sm:text-3xl font-bold text-white tracking-tight leading-tight" id="modal-title"></h2>
                </div>
                <button onclick="closeModal('project-modal')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition-colors shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-5 sm:p-6 overflow-y-auto space-y-6 flex-1 text-sm text-slate-300 bg-slate-950/50">
                <div class="rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 flex items-center justify-center min-h-[250px] relative">
                    <img id="modal-image" src="" alt="Project Image" class="w-full h-full object-cover max-h-[400px]">
                </div>

                <div>
                    <h4 class="text-sm font-semibold theme-text flex items-center gap-2 mb-3"><i data-lucide="file-text" class="w-4 h-4"></i> รายละเอียดโปรเจกต์</h4>
                    <p id="modal-desc" class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800/50 text-slate-300 leading-relaxed text-sm sm:text-base"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800/50">
                        <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 font-mono">ผู้จัดทำ</h4>
                        <div class="flex items-center gap-2 text-slate-300 text-base" id="modal-author"></div>
                    </div>
                    <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800/50">
                        <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 font-mono">วันที่เผยแพร่</h4>
                        <div class="flex items-center gap-2 text-slate-300 text-base" id="modal-date"></div>
                    </div>
                </div>

                <div>
                    <h4 class="text-sm font-semibold theme-text flex items-center gap-2 mb-3"><i data-lucide="cpu" class="w-4 h-4"></i> เทคโนโลยีที่ใช้</h4>
                    <div class="flex flex-wrap gap-2" id="modal-tags"></div>
                </div>
            </div>

            <div class="p-5 sm:p-6 bg-slate-900 border-t border-slate-800 flex justify-end items-center">
                <button onclick="closeModal('project-modal')" class="px-6 py-2.5 theme-bg text-slate-950 text-sm font-bold rounded-xl transition-colors opacity-90 hover:opacity-100">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- Submit Project Modal (For Students) -->
    <div id="submit-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full max-w-2xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col border border-slate-700/50 shadow-2xl transform scale-95 transition-transform duration-300">
            
            <div class="p-5 bg-slate-900 border-b border-slate-800 flex items-start justify-between">
                <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="upload-cloud" class="w-5 h-5 theme-text"></i> ส่งผลงานโปรเจกต์ใหม่</h2>
                <button onclick="closeModal('submit-modal')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 bg-slate-950/50">
                <form id="submit-form" onsubmit="submitProject(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อโปรเจกต์ (Project Title)</label>
                        <input type="text" id="sp-title" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none theme-border text-sm">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">หมวดหมู่ (Category)</label>
                            <select id="sp-cat" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none theme-border text-sm">
                                <option value="IoT & Hardware">IoT & Hardware</option>
                                <option value="Software & Automation">Software & Automation</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ลิงก์รูปภาพตัวอย่าง (Image URL)</label>
                            <input type="url" id="sp-img" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none theme-border text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">แท็กเทคโนโลยี (Tags) - คั่นด้วยลูกน้ำ</label>
                        <input type="text" id="sp-tags" placeholder="เช่น Node.js, React, ESP32" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none theme-border text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">คำอธิบายรายละเอียด (Description)</label>
                        <textarea id="sp-desc" rows="4" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none theme-border text-sm"></textarea>
                    </div>

                    <div class="pt-4 mt-2 border-t border-slate-800 flex justify-end gap-3">
                        <button type="button" onclick="closeModal('submit-modal')" class="px-5 py-2.5 bg-slate-800 text-white text-sm font-semibold rounded-xl hover:bg-slate-700 transition-colors">ยกเลิก</button>
                        <button type="submit" id="btn-sp-submit" class="px-6 py-2.5 theme-bg text-slate-950 text-sm font-bold rounded-xl shadow-lg transition-colors opacity-90 hover:opacity-100 flex items-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> ส่งผลงาน
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const API_URL = 'api.php';
        let projects = [];
        let currentGrade = 'all';
        let currentCategory = 'all';
        let searchQuery = '';

        document.addEventListener('DOMContentLoaded', () => {
            setupAuthUI();
            fetchSettings();
            fetchProjects();
            setupFilterEvents();
            setupSearchEvents();
        });

        // --- UI & Theme Config ---
        function applyTheme(themeName) {
            const root = document.documentElement;
            if (themeName === 'cyberpunk') {
                root.style.setProperty('--th-main', '#eab308'); // yellow-500
                root.style.setProperty('--th-soft', 'rgba(234, 179, 8, 0.1)');
                root.style.setProperty('--th-grad1', '#eab308');
                root.style.setProperty('--th-grad2', '#ec4899'); // pink-500
            } else if (themeName === 'techblue') {
                root.style.setProperty('--th-main', '#06b6d4'); // cyan-500
                root.style.setProperty('--th-soft', 'rgba(6, 182, 212, 0.1)');
                root.style.setProperty('--th-grad1', '#2563eb'); // blue-600
                root.style.setProperty('--th-grad2', '#22d3ee'); // cyan-400
            } else { // emerald default
                root.style.setProperty('--th-main', '#10b981'); // emerald-500
                root.style.setProperty('--th-soft', 'rgba(16, 185, 129, 0.1)');
                root.style.setProperty('--th-grad1', '#059669'); // emerald-600
                root.style.setProperty('--th-grad2', '#34d399'); // emerald-400
            }
        }

        async function fetchSettings() {
            try {
                const res = await fetch(`${API_URL}?action=get_settings`);
                const data = await res.json();
                if(data.status === 'success') {
                    const s = data.data;
                    document.getElementById('nav-brand').innerText = s.site_title || 'PROJECT.LOG';
                    document.getElementById('page-title').innerText = `${s.site_title || 'PROJECT.LOG'} | คลังเก็บผลงาน`;
                    document.getElementById('footer-text').innerText = `${s.site_title} © 2026`;
                    
                    document.getElementById('hero-title').innerHTML = (s.hero_title || 'คลังเก็บผลงานโปรเจกต์').replace(/\((.*?)\)/, '<span class="theme-gradient bg-clip-text text-transparent text-3xl sm:text-5xl mt-2 block">($1)</span>');
                    document.getElementById('hero-desc').innerText = s.hero_desc || '';
                    
                    applyTheme(s.theme || 'emerald');
                }
            } catch (err) {
                applyTheme('emerald');
            }
        }

        // --- Auth UI ---
        function setupAuthUI() {
            const authContainer = document.getElementById('nav-auth');
            
            if (session.id) {
                let html = `<span class="text-xs text-slate-400 font-mono hidden sm:inline mr-2">Hi, ${session.username}</span>`;
                
                if (session.role === 'admin') {
                    html += `<a href="admin.html" class="px-4 py-2 rounded-xl bg-slate-800 text-white hover:bg-slate-700 text-sm font-medium transition-colors border border-slate-700">เข้าสู่แดชบอร์ด</a>`;
                } else {
                    html += `<button onclick="openModal('submit-modal')" class="px-4 py-2 rounded-xl theme-bg text-slate-950 text-sm font-bold transition-colors opacity-90 hover:opacity-100 flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4"></i> ส่งผลงาน</button>`;
                }
                
                html += `<button onclick="logout()" class="p-2 rounded-xl bg-slate-900 text-slate-400 hover:text-red-400 hover:bg-slate-800 transition-colors" title="ออกจากระบบ"><i data-lucide="log-out" class="w-4 h-4"></i></button>`;
                authContainer.innerHTML = html;
            } else {
                authContainer.innerHTML = `
                    <a href="login.html" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-sm font-semibold transition-colors flex items-center gap-2">
                        <i data-lucide="log-in" class="w-4 h-4 theme-text"></i> <span>เข้าสู่ระบบ</span>
                    </a>
                `;
            }
            lucide.createIcons();
        }

        function logout() {
            localStorage.removeItem('nvc_user_session');
            window.location.reload();
        }

        // --- Projects Logic ---
        async function fetchProjects() {
            try {
                const res = await fetch(`${API_URL}?action=get_projects&status=approved`);
                const data = await res.json();
                if(data.status === 'success') {
                    projects = data.data;
                    renderProjects();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            const noRes = document.getElementById('no-results');

            const filtered = projects.filter(p => {
                const matchGrade = (currentGrade === 'all') || (p.level.includes(currentGrade));
                const matchCat = (currentCategory === 'all') || (p.category === currentCategory);
                
                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q || 
                    p.title.toLowerCase().includes(q) ||
                    p.description.toLowerCase().includes(q) ||
                    (p.tags && p.tags.some(t => t.toLowerCase().includes(q)));

                return matchGrade && matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noRes.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noRes.classList.add('hidden');

                grid.innerHTML = filtered.map(p => `
                    <div class="glass-card rounded-2xl overflow-hidden flex flex-col group hover:theme-border transition-all duration-300">
                        <div class="h-48 sm:h-52 bg-slate-900 relative overflow-hidden">
                            <img src="${p.image_url || 'https://via.placeholder.com/800x600/0f172a/10b981?text=No+Image'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
                            <div class="absolute top-4 left-4 right-4 flex justify-between items-start">
                                <span class="px-3 py-1.5 bg-slate-900/80 text-white text-xs font-bold rounded-lg border border-slate-700 backdrop-blur-md">${p.level}</span>
                            </div>
                        </div>

                        <div class="p-6 flex-1 flex flex-col space-y-4 bg-slate-900/50">
                            <div class="flex-1">
                                <h3 class="text-lg sm:text-xl font-bold text-white group-hover:theme-text transition-colors line-clamp-2 leading-tight">${p.title}</h3>
                                <p class="text-slate-400 text-sm mt-3 line-clamp-3 leading-relaxed">${p.description}</p>
                            </div>

                            <div class="flex flex-wrap gap-2 pt-2">
                                ${p.tags.slice(0,3).map(t => `<span class="text-[11px] font-medium bg-slate-800 text-slate-300 px-2 py-1 rounded-md border border-slate-700">${t}</span>`).join('')}
                                ${p.tags.length > 3 ? `<span class="text-[11px] font-medium bg-slate-800 text-slate-400 px-2 py-1 rounded-md border border-slate-700">+${p.tags.length - 3}</span>` : ''}
                            </div>
                            
                            <div class="pt-5 mt-auto border-t border-slate-800/80 flex items-center justify-between">
                                <div class="text-xs text-slate-500 font-mono flex items-center gap-1.5">
                                    <i data-lucide="user" class="w-3.5 h-3.5"></i> ${p.author_name || 'System'}
                                </div>
                                <button onclick="openProjectModal(${p.id})" class="px-4 py-2 theme-bg text-slate-950 text-xs font-bold rounded-xl transition-all shadow-lg opacity-90 hover:opacity-100 flex items-center gap-1">
                                    รายละเอียด <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        }

        // --- Filters ---
        function setupFilterEvents() {
            const gGroup = document.getElementById('grade-filter-group');
            gGroup.querySelectorAll('.grade-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    gGroup.querySelectorAll('.grade-btn').forEach(b => {
                        b.className = 'grade-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/50';
                    });
                    e.currentTarget.className = 'grade-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg text-slate-950 shadow-lg';
                    currentGrade = e.currentTarget.getAttribute('data-grade');
                    renderProjects();
                });
            });

            const cGroup = document.getElementById('category-filter-group');
            cGroup.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    cGroup.querySelectorAll('.cat-btn').forEach(b => {
                        b.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50';
                    });
                    e.currentTarget.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg-soft theme-text theme-border-soft border';
                    currentCategory = e.currentTarget.getAttribute('data-cat');
                    renderProjects();
                });
            });
        }

        function setupSearchEvents() {
            const input = document.getElementById('search-input');
            input.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProjects();
            });
        }

        function resetFilters() {
            currentGrade = 'all';
            currentCategory = 'all';
            searchQuery = '';
            document.getElementById('search-input').value = '';
            
            document.querySelectorAll('.grade-btn').forEach(b => b.className = 'grade-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/50');
            document.querySelector('.grade-btn[data-grade="all"]').className = 'grade-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg text-slate-950 shadow-lg';

            document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50');
            document.querySelector('.cat-btn[data-cat="all"]').className = 'cat-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all theme-bg-soft theme-text theme-border-soft border';

            renderProjects();
        }

        // --- Modals ---
        function openModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
            m.querySelector('> div').classList.remove('scale-95');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.add('opacity-0');
            m.querySelector('> div').classList.add('scale-95');
            setTimeout(() => {
                m.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        function openProjectModal(id) {
            const p = projects.find(item => item.id === id);
            if (!p) return;

            document.getElementById('modal-title').innerText = p.title;
            document.getElementById('modal-desc').innerText = p.description;
            document.getElementById('modal-image').src = p.image_url || 'https://via.placeholder.com/800x600/0f172a/10b981?text=No+Image';
            
            document.getElementById('modal-author').innerHTML = `<i data-lucide="user" class="w-5 h-5 theme-text"></i> ${p.author_name || 'System'}`;
            document.getElementById('modal-date').innerHTML = `<i data-lucide="calendar-days" class="w-5 h-5 theme-text"></i> ${new Date(p.created_at).toLocaleDateString('th-TH')}`;

            document.getElementById('modal-badges').innerHTML = `
                <span class="px-3 py-1 bg-slate-800 text-white text-xs font-bold rounded-lg border border-slate-700">${p.level}</span>
                <span class="px-3 py-1 theme-bg-soft theme-text text-xs font-bold rounded-lg theme-border-soft border">${p.category}</span>
            `;

            document.getElementById('modal-tags').innerHTML = p.tags.map(t => `<span class="text-sm font-medium bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">${t}</span>`).join('');
            
            openModal('project-modal');
        }

        // --- Submit Project ---
        async function submitProject(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-sp-submit');
            
            if(!session.id) {
                alert('Session หมดอายุ กรุณาล็อกอินใหม่');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังส่ง...`;

            const payload = {
                user_id: session.id,
                level: session.level || 'ปวช. 3',
                title: document.getElementById('sp-title').value,
                category: document.getElementById('sp-cat').value,
                image_url: document.getElementById('sp-img').value,
                tags: document.getElementById('sp-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
                description: document.getElementById('sp-desc').value
            };

            try {
                const res = await fetch(`${API_URL}?action=submit_project`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.status === 'success') {
                    alert('ส่งผลงานสำเร็จ! โปรดรอแอดมินตรวจสอบ');
                    document.getElementById('submit-form').reset();
                    closeModal('submit-modal');
                } else {
                    alert(data.message);
                }
            } catch(err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            }
            
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> ส่งผลงาน`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
