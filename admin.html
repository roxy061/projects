<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Project Archive</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Check Admin Session Early
        const session = JSON.parse(localStorage.getItem('nvc_user_session') || '{}');
        if (session.role !== 'admin') {
            window.location.href = 'login.html';
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-nav {
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

    <!-- Navbar -->
    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-white">Admin Dashboard</span>
            </div>
            
            <div class="flex items-center gap-4">
                <span class="text-xs text-slate-400 font-mono hidden sm:inline" id="admin-name"></span>
                <a href="index.html" target="_blank" class="text-xs text-slate-300 hover:text-emerald-400 flex items-center gap-1 transition-colors">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> ดูหน้าเว็บจริง
                </a>
                <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 text-xs font-semibold transition-colors flex items-center gap-1 border border-red-500/20">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i> ออกจากระบบ
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar Menu -->
        <aside class="lg:col-span-1 space-y-2">
            <button onclick="switchTab('approvals')" id="tab-approvals" class="w-full text-left px-4 py-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold text-sm flex items-center gap-2 transition-all">
                <i data-lucide="clipboard-check" class="w-4 h-4"></i> จัดการโปรเจกต์ (Approvals)
            </button>
            <button onclick="switchTab('config')" id="tab-config" class="w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white font-semibold text-sm flex items-center gap-2 transition-all">
                <i data-lucide="palette" class="w-4 h-4"></i> ปรับแต่ง UI หน้าเว็บ (Config)
            </button>
            <a href="checklist.html" class="w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white font-semibold text-sm flex items-center gap-2 transition-all block">
                <i data-lucide="server" class="w-4 h-4"></i> เช็กสถานะเซิร์ฟเวอร์ (Server Audit)
            </a>
        </aside>

        <!-- Main Content Area -->
        <div class="lg:col-span-3">
            
            <!-- Tab: Approvals -->
            <div id="content-approvals" class="space-y-6">
                <div class="glass-card p-6 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                        <i data-lucide="list-todo" class="w-5 h-5 text-emerald-400"></i> รอการตรวจสอบ
                    </h2>
                    <p class="text-xs text-slate-400 mb-6">รายการโปรเจกต์ที่นักศึกษาส่งเข้ามาใหม่</p>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs text-slate-500 uppercase font-mono border-b border-slate-800">
                                    <th class="pb-3 pr-4 font-semibold">ชื่อโปรเจกต์</th>
                                    <th class="pb-3 px-4 font-semibold">ผู้ส่ง (Author)</th>
                                    <th class="pb-3 px-4 font-semibold">ระดับชั้น</th>
                                    <th class="pb-3 px-4 font-semibold text-center">สถานะ</th>
                                    <th class="pb-3 pl-4 font-semibold text-right">การจัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="projects-table-body" class="text-sm divide-y divide-slate-800/50">
                                <!-- Dynamic Rows -->
                                <tr><td colspan="5" class="py-8 text-center text-slate-500">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Tab: UI Configurator -->
            <div id="content-config" class="hidden space-y-6">
                <div class="glass-card p-6 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                        <i data-lucide="layout-template" class="w-5 h-5 text-cyan-400"></i> No-Code UI Configurator
                    </h2>
                    <p class="text-xs text-slate-400 mb-6">ปรับแต่งข้อความและโทนสีของหน้าเว็บหลัก (index.html) โดยไม่ต้องแก้ไขโค้ด</p>

                    <form id="settings-form" onsubmit="saveSettings(event)" class="space-y-5">
                        
                        <!-- Site Title -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อเว็บ (Site Title / Brand Name)</label>
                            <input type="text" id="cfg-site-title" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
                        </div>

                        <!-- Hero Title -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">หัวข้อหลัก (Hero Title)</label>
                            <input type="text" id="cfg-hero-title" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
                        </div>

                        <!-- Hero Description -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">คำอธิบายย่อย (Hero Description)</label>
                            <textarea id="cfg-hero-desc" rows="2" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm"></textarea>
                        </div>

                        <!-- Theme Selection -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 font-mono mb-2">โทนสีหลัก (Theme Palette)</label>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                
                                <label class="cursor-pointer">
                                    <input type="radio" name="theme" value="emerald" class="peer sr-only">
                                    <div class="p-3 rounded-xl border border-slate-700 bg-slate-900 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition-all text-center">
                                        <div class="w-full h-8 rounded bg-gradient-to-r from-emerald-600 to-emerald-400 mb-2"></div>
                                        <span class="text-xs font-semibold text-slate-300">Slate / Emerald</span>
                                    </div>
                                </label>

                                <label class="cursor-pointer">
                                    <input type="radio" name="theme" value="cyberpunk" class="peer sr-only">
                                    <div class="p-3 rounded-xl border border-slate-700 bg-slate-900 peer-checked:border-yellow-500 peer-checked:bg-yellow-500/10 transition-all text-center">
                                        <div class="w-full h-8 rounded bg-gradient-to-r from-yellow-500 to-pink-500 mb-2"></div>
                                        <span class="text-xs font-semibold text-slate-300">Cyberpunk Dark</span>
                                    </div>
                                </label>

                                <label class="cursor-pointer">
                                    <input type="radio" name="theme" value="techblue" class="peer sr-only">
                                    <div class="p-3 rounded-xl border border-slate-700 bg-slate-900 peer-checked:border-blue-500 peer-checked:bg-blue-500/10 transition-all text-center">
                                        <div class="w-full h-8 rounded bg-gradient-to-r from-blue-600 to-cyan-400 mb-2"></div>
                                        <span class="text-xs font-semibold text-slate-300">Tech Blue</span>
                                    </div>
                                </label>

                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-800 flex justify-end">
                            <button type="submit" id="btn-save-cfg" class="px-6 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl transition-all shadow-lg flex items-center gap-2">
                                <i data-lucide="save" class="w-4 h-4"></i> บันทึกการตั้งค่า
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API_URL = 'api.php';
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('admin-name').innerText = `Admin: ${session.fullname || session.username}`;
            lucide.createIcons();
            fetchProjects();
            fetchSettings();
        });

        function logout() {
            localStorage.removeItem('nvc_user_session');
            window.location.href = 'login.html';
        }

        function switchTab(tab) {
            const btnAppr = document.getElementById('tab-approvals');
            const btnConf = document.getElementById('tab-config');
            const contentAppr = document.getElementById('content-approvals');
            const contentConf = document.getElementById('content-config');

            if(tab === 'approvals') {
                btnAppr.className = 'w-full text-left px-4 py-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold text-sm flex items-center gap-2 transition-all';
                btnConf.className = 'w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white font-semibold text-sm flex items-center gap-2 transition-all';
                contentAppr.classList.remove('hidden');
                contentConf.classList.add('hidden');
            } else {
                btnConf.className = 'w-full text-left px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-semibold text-sm flex items-center gap-2 transition-all';
                btnAppr.className = 'w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-900 hover:text-white font-semibold text-sm flex items-center gap-2 transition-all';
                contentConf.classList.remove('hidden');
                contentAppr.classList.add('hidden');
            }
        }

        // --- Approvals Logic ---
        async function fetchProjects() {
            try {
                const res = await fetch(`${API_URL}?action=get_projects&status=all`);
                const data = await res.json();
                const tbody = document.getElementById('projects-table-body');
                
                if(data.status === 'success' && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(p => `
                        <tr class="hover:bg-slate-900/50 transition-colors group">
                            <td class="py-4 pr-4">
                                <div class="font-semibold text-white line-clamp-1">${p.title}</div>
                                <div class="text-[11px] text-slate-500 font-mono mt-0.5">${p.category}</div>
                            </td>
                            <td class="py-4 px-4 text-slate-400">${p.author_name || 'Admin/System'}</td>
                            <td class="py-4 px-4 text-slate-400 text-xs">${p.level}</td>
                            <td class="py-4 px-4 text-center">
                                ${getStatusBadge(p.status)}
                            </td>
                            <td class="py-4 pl-4 text-right space-x-1 opacity-50 group-hover:opacity-100 transition-opacity">
                                ${p.status === 'pending' ? `
                                    <button onclick="changeStatus(${p.id}, 'approved')" class="p-1.5 bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 rounded-lg transition-colors border border-emerald-500/20" title="Approve">
                                        <i data-lucide="check" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="changeStatus(${p.id}, 'rejected')" class="p-1.5 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-slate-950 rounded-lg transition-colors border border-red-500/20" title="Reject">
                                        <i data-lucide="x" class="w-4 h-4"></i>
                                    </button>
                                ` : `
                                    <button onclick="deleteProject(${p.id})" class="p-1.5 bg-slate-800 hover:bg-red-500 text-slate-400 hover:text-white rounded-lg transition-colors" title="Delete">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                `}
                            </td>
                        </tr>
                    `).join('');
                    lucide.createIcons();
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500">ไม่พบข้อมูลโปรเจกต์</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function getStatusBadge(status) {
            if(status === 'approved') return '<span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded text-[10px] uppercase font-bold tracking-wider">Approved</span>';
            if(status === 'rejected') return '<span class="px-2 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded text-[10px] uppercase font-bold tracking-wider">Rejected</span>';
            return '<span class="px-2 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded text-[10px] uppercase font-bold tracking-wider">Pending</span>';
        }

        async function changeStatus(id, status) {
            if(!confirm(`ยืนยันการ ${status} โปรเจกต์นี้?`)) return;
            try {
                const res = await fetch(`${API_URL}?action=change_project_status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });
                const data = await res.json();
                if(data.status === 'success') fetchProjects();
                else alert(data.message);
            } catch (err) {
                alert('Error connecting to server');
            }
        }

        async function deleteProject(id) {
            if(!confirm(`ยืนยันการลบโปรเจกต์นี้อย่างถาวร?`)) return;
            try {
                const res = await fetch(`${API_URL}?action=delete_project`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                if(data.status === 'success') fetchProjects();
                else alert(data.message);
            } catch (err) {
                alert('Error connecting to server');
            }
        }

        // --- UI Configurator Logic ---
        async function fetchSettings() {
            try {
                const res = await fetch(`${API_URL}?action=get_settings`);
                const data = await res.json();
                if(data.status === 'success' && data.data) {
                    const s = data.data;
                    document.getElementById('cfg-site-title').value = s.site_title || '';
                    document.getElementById('cfg-hero-title').value = s.hero_title || '';
                    document.getElementById('cfg-hero-desc').value = s.hero_desc || '';
                    
                    const theme = s.theme || 'emerald';
                    const radio = document.querySelector(`input[name="theme"][value="${theme}"]`);
                    if(radio) radio.checked = true;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-cfg');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึก...`;
            
            const payload = {
                site_title: document.getElementById('cfg-site-title').value.trim(),
                hero_title: document.getElementById('cfg-hero-title').value.trim(),
                hero_desc: document.getElementById('cfg-hero-desc').value.trim(),
                theme: document.querySelector('input[name="theme"]:checked').value
            };

            try {
                const res = await fetch(`${API_URL}?action=update_settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.status === 'success') {
                    btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> บันทึกสำเร็จ`;
                    btn.classList.replace('bg-cyan-500', 'bg-emerald-500');
                    setTimeout(() => {
                        btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> บันทึกการตั้งค่า`;
                        btn.classList.replace('bg-emerald-500', 'bg-cyan-500');
                        lucide.createIcons();
                    }, 2000);
                } else {
                    alert(data.message);
                    btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> บันทึกการตั้งค่า`;
                }
            } catch (err) {
                alert('Error connecting to server');
                btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> บันทึกการตั้งค่า`;
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
