<!DOCTYPE html>
<html lang="th" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ระบบจัดการโปรเจกต์นักศึกษา</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-cyan-500/20">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                    <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">Project Management Dashboard</span>
                    <p class="text-xs text-slate-400">ระบบจัดการโปรเจกต์นักศึกษา (CRUD Operations)</p>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-1 bg-slate-900/90 p-1.5 rounded-full border border-slate-800">
                <a href="index.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-colors flex items-center gap-2">
                    <i data-lucide="folder-git-2" class="w-4 h-4"></i> คลังโปรเจกต์
                </a>
                <a href="checklist.html" class="px-4 py-2 rounded-full text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-colors flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> Server Audit
                </a>
                <a href="admin.html" class="px-4 py-2 rounded-full text-sm font-semibold text-cyan-400 bg-slate-800 transition-colors flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 text-cyan-400"></i> แดชบอร์ดจัดการ
                </a>
            </nav>

            <div class="flex items-center gap-3">
                <div class="hidden sm:block text-right">
                    <div id="session-user" class="text-xs font-bold text-emerald-400 font-mono">admin</div>
                    <div class="text-[10px] text-slate-500">Administrator</div>
                </div>
                <button onclick="handleLogout()" class="p-2.5 rounded-xl bg-slate-900 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-800 transition-colors" title="ออกจากระบบ">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- DASHBOARD CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full space-y-8">
        
        <!-- Action Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 glass-card p-6 rounded-3xl">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="folder-plus" class="w-6 h-6 text-emerald-400"></i>
                    รายการโปรเจกต์ในระบบ
                </h1>
                <p class="text-xs text-slate-400 mt-1">สามารถเพิ่ม แก้ไข และลบข้อมูลโปรเจกต์นักศึกษาได้ทันที</p>
            </div>
            <button onclick="openFormModal()" class="px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-2">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span>เพิ่มโปรเจกต์ใหม่</span>
            </button>
        </div>

        <!-- Table Container -->
        <div class="glass-card rounded-3xl overflow-hidden border border-slate-800">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 border-b border-slate-800 text-slate-400 text-xs font-mono uppercase">
                            <th class="p-4">ID</th>
                            <th class="p-4">ชื่อโปรเจกต์</th>
                            <th class="p-4">ระดับชั้น</th>
                            <th class="p-4">ประเภทเทคโนโลยี</th>
                            <th class="p-4">สถานะ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Table Rows rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- CRUD FORM MODAL -->
    <div id="form-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass-card w-full max-w-2xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col border border-slate-700 shadow-2xl">
            
            <div class="p-6 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center gap-2" id="modal-form-title">
                    <i data-lucide="edit-3" class="w-5 h-5 text-emerald-400"></i> เพิ่มข้อมูลโปรเจกต์
                </h3>
                <button onclick="closeFormModal()" class="p-2 bg-slate-800 text-slate-400 hover:text-white rounded-xl">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="project-form" onsubmit="saveProject(event)" class="p-6 overflow-y-auto space-y-4 text-sm flex-1">
                <input type="hidden" id="edit-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ชื่อโปรเจกต์ / โครงงาน:</label>
                    <input type="text" id="form-title" required placeholder="เช่น ระบบบริหารจัดการคลังสินค้าออนไลน์" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ระดับชั้น:</label>
                        <select id="form-level" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
                            <option value="ปวช. 1-2">ปวช. 1-2</option>
                            <option value="ปวช. 3">ปวช. 3 (โครงงาน)</option>
                            <option value="ปวส. 1">ปวส. 1</option>
                            <option value="ปวส. 2">ปวส. 2 (นวัตกรรม)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ประเภทเทคโนโลยี:</label>
                        <select id="form-category" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
                            <option value="IoT & Embedded Systems">IoT & Embedded Systems</option>
                            <option value="Web & Database">Web & Database</option>
                            <option value="Python & Automation">Python & Automation</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">อุปกรณ์ / ภาษา / Tags ที่ใช้ (คั่นด้วยจุลภาค ,):</label>
                    <input type="text" id="form-tags" placeholder="เช่น ESP32, Sensor DHT22, MariaDB, Python" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">รายละเอียดและวัตถุประสงค์โปรเจกต์:</label>
                    <textarea id="form-desc" rows="3" required placeholder="อธิบายรายละเอียดการทำงาน..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">URL รูปวงจร / ไดอะแกรม (Circuit / Diagram Image URL):</label>
                    <input type="url" id="form-image" placeholder="https://images.unsplash.com/photo-..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 font-mono">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">ลิงก์ GitHub Code:</label>
                        <input type="url" id="form-github" placeholder="https://github.com/username/project" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 font-mono">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 font-mono mb-1">สถานะโปรเจกต์:</label>
                        <select id="form-status" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
                            <option value="Completed">Completed (เสร็จสมบูรณ์)</option>
                            <option value="In Progress">In Progress (กำลังดำเนินการ)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-800">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-emerald-400">บันทึกข้อมูล</button>
                </div>
            </form>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const defaultData = [
            { id: 1, title: "ระบบคิวและจองคิวบริการซ่อมคอมพิวเตอร์", level: "ปวส. 1", category: "Web & Database", description: "ระบบคิวบริการซ่อมคอมพิวเตอร์", tags: ["PHP", "MariaDB", "Nginx"], status: "Completed", imageUrl: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=600", githubUrl: "https://github.com" },
            { id: 2, title: "ตู้อบเมล่อนอัจฉริยะด้วย ESP32 & IoT", level: "ปวช. 3", category: "IoT & Embedded Systems", description: "โครงงานตู้อบเมล่อนและเซนเซอร์", tags: ["ESP32", "MariaDB", "Python"], status: "Completed", imageUrl: "https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=600", githubUrl: "https://github.com" }
        ];

        let projects = JSON.parse(localStorage.getItem('nvc_projects')) || defaultData;

        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
            renderTable();
            lucide.createIcons();
        });

        function checkSession() {
            const sess = localStorage.getItem('nvc_user_session');
            if (sess) {
                try {
                    const parsed = JSON.parse(sess);
                    if (parsed.username) document.getElementById('session-user').innerText = parsed.username;
                } catch(e) {}
            }
        }

        function handleLogout() {
            localStorage.removeItem('nvc_user_session');
            window.location.href = 'login.html';
        }

        function renderTable() {
            const body = document.getElementById('admin-table-body');
            body.innerHTML = projects.map(p => `
                <tr class="hover:bg-slate-900/50 transition-colors">
                    <td class="p-4 font-mono text-emerald-400">#${p.id}</td>
                    <td class="p-4 font-semibold text-slate-200">${p.title}</td>
                    <td class="p-4"><span class="px-2 py-0.5 bg-slate-900 text-emerald-400 text-xs font-mono rounded border border-slate-800">${p.level}</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 bg-slate-900 text-cyan-400 text-xs font-mono rounded border border-slate-800">${p.category}</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 ${p.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'} text-xs font-mono rounded">${p.status}</span></td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="editProject(${p.id})" class="p-1.5 bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-slate-300 rounded-lg transition-colors" title="แก้ไข">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteProject(${p.id})" class="p-1.5 bg-slate-800 hover:bg-red-500 hover:text-white text-slate-300 rounded-lg transition-colors" title="ลบ">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function openFormModal(isEdit = false) {
            if (!isEdit) {
                document.getElementById('project-form').reset();
                document.getElementById('edit-id').value = '';
                document.getElementById('modal-form-title').innerText = 'เพิ่มข้อมูลโปรเจกต์ใหม่';
            }
            document.getElementById('form-modal').classList.remove('hidden');
            document.getElementById('form-modal').classList.add('flex');
        }

        function closeFormModal() {
            document.getElementById('form-modal').classList.add('hidden');
            document.getElementById('form-modal').classList.remove('flex');
        }

        function saveProject(e) {
            e.preventDefault();
            const idVal = document.getElementById('edit-id').value;
            const title = document.getElementById('form-title').value;
            const level = document.getElementById('form-level').value;
            const category = document.getElementById('form-category').value;
            const tagsStr = document.getElementById('form-tags').value;
            const description = document.getElementById('form-desc').value;
            const imageUrl = document.getElementById('form-image').value || 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600';
            const githubUrl = document.getElementById('form-github').value || 'https://github.com';
            const status = document.getElementById('form-status').value;

            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) : ['General'];

            if (idVal) {
                // Edit
                const idx = projects.findIndex(p => p.id == idVal);
                if (idx !== -1) {
                    projects[idx] = { id: Number(idVal), title, level, category, description, tags, status, imageUrl, githubUrl };
                }
            } else {
                // Create
                const newId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) + 1 : 1;
                projects.push({ id: newId, title, level, category, description, tags, status, imageUrl, githubUrl });
            }

            localStorage.setItem('nvc_projects', JSON.stringify(projects));
            renderTable();
            closeFormModal();
        }

        function editProject(id) {
            const p = projects.find(item => item.id === id);
            if (!p) return;

            document.getElementById('edit-id').value = p.id;
            document.getElementById('form-title').value = p.title;
            document.getElementById('form-level').value = p.level;
            document.getElementById('form-category').value = p.category;
            document.getElementById('form-tags').value = p.tags.join(', ');
            document.getElementById('form-desc').value = p.description;
            document.getElementById('form-image').value = p.imageUrl;
            document.getElementById('form-github').value = p.githubUrl;
            document.getElementById('form-status').value = p.status;

            document.getElementById('modal-form-title').innerText = `แก้ไขโปรเจกต์ #${p.id}`;
            openFormModal(true);
        }

        function deleteProject(id) {
            if (confirm(`คุณต้องการลบโปรเจกต์ #${id} ใช่หรือไม่?`)) {
                projects = projects.filter(p => p.id !== id);
                localStorage.setItem('nvc_projects', JSON.stringify(projects));
                renderTable();
            }
        }
    </script>
</body>
</html>
